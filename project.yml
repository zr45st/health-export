name: HealthExport
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  HealthExport:
    type: application
    platform: iOS
    sources:
      - path: HealthExport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.HealthExport
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: HealthExport/HealthExport.entitlements
        INFOPLIST_FILE: HealthExport/Info.plist
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
